name: Build Windows

# Builds Vpn-Ofmes on a real Windows runner (Visual Studio 2022 + Qt 6),
# since the CLI environment used to write this code has no Windows/MSVC
# available to produce a .exe locally. Run this manually from the
# "Actions" tab (workflow_dispatch) any time you want a fresh build, or
# just push to get one automatically.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

env:
  QT_VERSION: "6.7.3"
  # Falls back to this when the workflow is run manually (workflow_dispatch)
  # rather than triggered by an actual "vX.Y.Z" tag push.
  RELEASE_VERSION: "1.0.0"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2019_64"
          # QtSvg ships as part of the base desktop install for this Qt
          # version (not as an addon), so it isn't a valid --modules name;
          # requesting it here made aqtinstall fail immediately.
          cache: true

      - name: Configure (CMake + whichever Visual Studio the runner ships)
        shell: pwsh
        run: |
          # Don't hardcode a Visual Studio generator name/version: the
          # windows-latest runner image's bundled VS version changes over
          # time (e.g. it moved from VS2022 to VS2026), so let CMake
          # auto-detect whatever is actually installed and just pin the
          # architecture.
          cmake -B build -S . -A x64 `
                -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;$env:Qt6_DIR"

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt runtime DLLs next to the executable
        shell: pwsh
        run: |
          windeployqt --release --no-translations --no-compiler-runtime `
                      build\Release\VpnOfmes.exe

      # This is the artifact most people want: VpnOfmes.exe plus every Qt
      # DLL/plugin it needs and the app's styles/config assets, ready to
      # run on any Windows machine without installing Qt.
      - name: Upload Vpn-Ofmes.exe (ready-to-run folder)
        uses: actions/upload-artifact@v4
        with:
          name: Vpn-Ofmes-windows-x64
          path: build/Release/
          if-no-files-found: error

      - name: Package a release ZIP (CPack)
        working-directory: build
        run: cpack -G ZIP -C Release

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Vpn-Ofmes-release-zip
          path: build/*.zip
          if-no-files-found: error

  # Publishes both build artifacts as a GitHub Release, either when a
  # version tag like v1.0.0 is pushed, or when this workflow is run
  # manually from the Actions tab (workflow_dispatch) -- in the manual
  # case softprops/action-gh-release creates the "vX.Y.Z" tag itself via
  # the GitHub API, so no local `git push --tags` access is required.
  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download CPack release ZIP
        uses: actions/download-artifact@v4
        with:
          name: Vpn-Ofmes-release-zip
          path: dist

      - name: Download ready-to-run folder
        uses: actions/download-artifact@v4
        with:
          name: Vpn-Ofmes-windows-x64
          path: dist-unpacked/Vpn-Ofmes-windows-x64

      - name: Zip the ready-to-run folder
        working-directory: dist-unpacked
        run: zip -r ../dist/Vpn-Ofmes-windows-x64.zip Vpn-Ofmes-windows-x64

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ env.RELEASE_VERSION }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Vpn-Ofmes ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*.zip
