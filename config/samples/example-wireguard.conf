# -----------------------------------------------------------------------
# EXAMPLE WireGuard client configuration.
#
# This is a placeholder template shipped with Vpn-Ofmes so the app has
# something to show in the server list out of the box. It will NOT
# connect to anything real. Replace PrivateKey/PublicKey/Endpoint with
# the values your WireGuard server (or provider) gives you, for example
# via `wg genkey` / `wg pubkey`, and rename this file (or add a new one
# next to it) to match a server profile in servers.default.json /
# servers.json.
# -----------------------------------------------------------------------

[Interface]
PrivateKey = REPLACE_WITH_YOUR_CLIENT_PRIVATE_KEY
Address = 10.8.0.2/32
DNS = 1.1.1.1

[Peer]
PublicKey = REPLACE_WITH_YOUR_SERVER_PUBLIC_KEY
Endpoint = wg.example.com:51820
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 25
